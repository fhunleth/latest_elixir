name: Update Docker Tags

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Install dependencies
        run: mix deps.get

      # The tag cache (_cache/*.txt) is committed to the repo, so checkout
      # restores it. Tags only ever get added, so this stays monotonic and
      # survives across runs without relying on the ephemeral Actions cache.
      - name: Fetch tags and build site
        run: mix site

      - name: Commit updated tag cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _cache
          if git diff --staged --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Update tag cache"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
